name: motionmate
description: MotionMate, an interactive character app for iOS and Android with Android live wallpaper support.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pocket_live2d_native:
    path: packages/pocket_live2d_native
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/live2d/mark/
    - assets/live2d/mark/Mark.2048/
    - assets/live2d/mark/motions/
    - assets/live2d/mark/expressions/
    - assets/legal/
