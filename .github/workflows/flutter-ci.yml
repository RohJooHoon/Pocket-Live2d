name: Flutter and native bridge

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test packages/pocket_live2d_native/lib
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-dart-sources
          path: |
            lib
            test
            packages/pocket_live2d_native/lib
      - run: flutter analyze --fatal-infos
      - run: flutter test --timeout 30s
      - run: bash tool/test_bootstrap.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: POCKET_LIVE2D_SKIP_TESTS=1 bash tool/bootstrap_platforms.sh
      - run: flutter build apk --debug
      - run: ./android/gradlew -p android :pocket_live2d_native:testDebugUnitTest

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: POCKET_LIVE2D_SKIP_TESTS=1 bash tool/bootstrap_platforms.sh
      - run: flutter build ios --simulator --debug
