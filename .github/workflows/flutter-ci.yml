name: Flutter CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check setup script syntax
        run: python3 -m py_compile tool/*.py

      - name: Validate bundled Live2D model
        run: python3 tool/validate_model_assets.py

      - name: Test native input filtering
        run: g++ -std=c++17 -Wall -Wextra -Werror test/native/input_test.cpp -o /tmp/pocket-input-test && /tmp/pocket-input-test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-native:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: bash tool/bootstrap_platforms.sh android

      - name: Build Android debug APK
        run: flutter build apk --debug

  ios-native:
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS host project
        run: bash tool/bootstrap_platforms.sh ios

      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
