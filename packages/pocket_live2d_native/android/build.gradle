group 'com.rohjoohoon.pocket_live2d_native'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.rohjoohoon.pocket_live2d_native'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def cameraXVersion = '1.6.2'

def faceLandmarkerAssetDir = file("$projectDir/src/main/assets")
def faceLandmarkerModel = file("$faceLandmarkerAssetDir/face_landmarker.task")
def faceLandmarkerModelUrl = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'

tasks.register('downloadFaceLandmarkerModel') {
    outputs.file(faceLandmarkerModel)
    doLast {
        if (!faceLandmarkerModel.exists()) {
            faceLandmarkerAssetDir.mkdirs()
            ant.get(
                src: faceLandmarkerModelUrl,
                dest: faceLandmarkerModel,
                skipexisting: true,
            )
        }
    }
}

preBuild.dependsOn tasks.named('downloadFaceLandmarkerModel')

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.17.0'

    implementation "androidx.camera:camera-core:$cameraXVersion"
    implementation "androidx.camera:camera-camera2:$cameraXVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraXVersion"

    implementation 'com.google.mediapipe:tasks-vision:1.0.0'
}
