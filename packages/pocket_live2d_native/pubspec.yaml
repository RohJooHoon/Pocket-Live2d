name: pocket_live2d_native
description: Native surface and motion input adapter for Pocket Live2D.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.rohjoohoon.pocket_live2d_native
        pluginClass: PocketLive2dNativePlugin
      ios:
        pluginClass: PocketLive2dNativePlugin
