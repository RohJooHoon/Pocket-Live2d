<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef4f0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233f7d5c'/%3E%3Ccircle cx='11' cy='14' r='2.5' fill='white'/%3E%3Ccircle cx='21' cy='14' r='2.5' fill='white'/%3E%3C/svg%3E"
    />
    <title>MotionMate</title>
    <!-- cubism-core -->
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <main class="stage">
      <canvas id="character-canvas" aria-label="캐릭터"></canvas>

      <header class="top-bar">
        <h1 id="character-name"></h1>
        <button id="info-button" class="icon-button" type="button" aria-label="정보">i</button>
      </header>

      <p id="status" class="status" role="status" hidden></p>

      <nav class="controls" aria-label="캐릭터 조작">
        <button id="motion-toggle" type="button" aria-pressed="false">기울이기·흔들기 켜기</button>
        <button id="react-button" type="button" disabled>반응</button>
        <button id="expression-button" type="button" disabled>표정</button>
      </nav>
    </main>

    <dialog id="consent-dialog" class="sheet" aria-labelledby="consent-title">
      <h2 id="consent-title"></h2>
      <p>회원가입이 없고, 개인정보를 따로 수집하지 않아요.</p>
      <ul>
        <li>기울이기·흔들기를 켜면 기기의 동작 센서 값을 이 기기 안에서만 사용해요.</li>
        <li>캐릭터와 이 페이지에 포함된 Live2D Cubism SDK 등 소프트웨어를 분석하거나 추출해서 배포하면 안 돼요.</li>
      </ul>
      <div class="link-row">
        <button type="button" class="link-button" data-document="terms">이용약관</button>
        <button type="button" class="link-button" data-document="privacy">개인정보처리방침</button>
      </div>
      <p class="fine-print">‘동의하고 시작하기’를 누르면 이용약관과 개인정보처리방침에 동의하게 돼요.</p>
      <button id="consent-accept" type="button" class="primary">동의하고 시작하기</button>
    </dialog>

    <dialog id="info-dialog" class="sheet" aria-labelledby="info-title">
      <h2 id="info-title"></h2>
      <p id="info-credit" class="fine-print"></p>
      <p class="fine-print">
        캐릭터 표시에 Live2D Cubism SDK를 사용합니다. Live2D는 Live2D Inc.의 상표이며, 이 페이지는 Live2D Inc.가 만들거나 인증한 것이 아닙니다.
      </p>
      <div class="link-row">
        <button type="button" class="link-button" data-document="terms">이용약관</button>
        <button type="button" class="link-button" data-document="privacy">개인정보처리방침</button>
      </div>
      <form method="dialog"><button class="primary">닫기</button></form>
    </dialog>

    <dialog id="document-dialog" class="sheet document" aria-labelledby="document-title">
      <header>
        <h2 id="document-title"></h2>
        <form method="dialog"><button class="icon-button" aria-label="닫기">×</button></form>
      </header>
      <article id="document-body"></article>
    </dialog>
  </body>
</html>
